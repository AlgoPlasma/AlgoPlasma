<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="570" viewBox="0 0 1080 570" role="img" aria-labelledby="title desc">
<title id="title">A free-molecular history from injection to escape</title>
<desc id="desc">The horizontal axis is radius and the vertical axis is axial position. A particle enters at the bottom, crosses internal faces in straight flight, reflects at the right wall and exits at the top. Each segment adds residence time and each face crossing adds a signed count.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#267d8d"/></marker></defs>
<rect width="1080" height="570" rx="12" fill="#f7f9fc"/>
<g font-family="Arial, Microsoft YaHei, sans-serif" fill="#233446">
<text x="32" y="40" font-size="25" font-weight="bold">Velocity changes only at wall encounters</text>
<rect x="90" y="100" width="440" height="320" fill="#eaf2f5"/>
<g stroke="#c6d4df" stroke-width="1.3"><path d="M200 100V420 M310 100V420 M420 100V420 M90 180H530 M90 260H530 M90 340H530"/></g>
<path d="M90 100V420 M530 100V420" stroke="#657787" stroke-width="6"/>
<path d="M90 100H530" stroke="#267d8d" stroke-width="5" stroke-dasharray="9 6"/>
<path d="M90 420H530" stroke="#cc8b39" stroke-width="6"/>
<g fill="none" stroke="#267d8d" stroke-width="3" marker-end="url(#arrow)">
<path d="M210 476V423"/><path d="M210 413L526 215"/><path d="M526 215L375 72"/>
<path d="M55 440H550" stroke-width="2"/><path d="M55 440V82" stroke-width="2"/>
</g>
<circle cx="210" cy="413" r="6" fill="#cc8b39"/><circle cx="526" cy="215" r="7" fill="#cc8b39"/>
<text x="562" y="446" font-size="22" font-family="Georgia, serif">r</text><text x="44" y="72" font-size="22" font-family="Georgia, serif">z</text>
<text x="182" y="505" font-size="20">Uniform injection per unit area</text>
<text x="220" y="80" font-size="19">Open outlet</text>
<text x="111" y="240" font-size="18">Straight flight</text><path d="M198 235L277 370" stroke="#849aa8" fill="none"/>
<rect x="590" y="100" width="450" height="108" rx="8" fill="#e9f3f4" stroke="#adcac9"/>
<text x="610" y="131" font-size="21" font-weight="bold">① Flight segment</text>
<text x="610" y="162" font-size="19">Add time and velocity × time to the cell totals.</text>
<text x="610" y="190" font-size="17">Score +1 or −1 for each internal face crossing.</text>
<rect x="590" y="226" width="450" height="108" rx="8" fill="#fff1dc" stroke="#ddbf91"/>
<text x="610" y="257" font-size="21" font-weight="bold">② Reflection at a wall</text>
<text x="610" y="288" font-size="19">Specular or diffuse reflection sets the velocity.</text>
<text x="610" y="316" font-size="17">Same history and rate weight. No net wall outflow.</text>
<rect x="590" y="352" width="450" height="108" rx="8" fill="#e9f3f4" stroke="#adcac9"/>
<text x="610" y="383" font-size="21" font-weight="bold">③ Escape through an open boundary</text>
<text x="610" y="414" font-size="19">Count the escape, then start the next history.</text>
<text x="610" y="442" font-size="17">Particles can also leave through the open inlet.</text>
<text x="32" y="548" font-size="18" fill="#526779">One history is shown. Convert the totals to fields after all histories, using the inlet rate and grid geometry.</text>
</g></svg>
