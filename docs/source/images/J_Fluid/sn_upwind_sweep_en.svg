<title id="title">Upwind sweeps for two velocity directions</title>
<desc id="desc">For a velocity pointing upper right, start at the lower left; the center receives inflow from the left and below. Reverse the velocity and the center receives inflow from the right and above. Numbers 1–9 show the cell solve order.</desc>
<defs><marker id="flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#217b78"/></marker></defs>
<rect width="1120" height="660" rx="12" fill="#f7f9fc"/>
<g font-family="Arial, Microsoft YaHei, sans-serif" fill="#233446">
<text x="32" y="40" font-size="25" font-weight="bold">Sweep order on the same grid for two velocity directions</text>
<text x="32" y="75" font-size="19">Each grid shows one discrete velocity. Arrows identify the upstream cells that feed the center.</text><g transform="translate(65 0)"><text x="0" y="125" font-size="22" font-weight="bold">Velocity toward the upper right</text>
 <text x="16" y="158" font-family="Georgia, serif" font-size="22">v<tspan baseline-shift="sub" font-size="14">r</tspan> &gt; 0, v<tspan baseline-shift="sub" font-size="14">z</tspan> &gt; 0</text><g transform="translate(25 195)"><rect x="0" y="0" width="110" height="90" fill="#eaf0f7" stroke="#8a9baa"/><text x="55" y="37" text-anchor="middle" font-size="25">3</text><rect x="110" y="0" width="110" height="90" fill="#eaf0f7" stroke="#8a9baa"/><text x="165" y="37" text-anchor="middle" font-size="25">6</text><rect x="220" y="0" width="110" height="90" fill="#eaf0f7" stroke="#8a9baa"/><text x="275" y="37" text-anchor="middle" font-size="25">9</text><rect x="0" y="90" width="110" height="90" fill="#d8eeea" stroke="#8a9baa"/><text x="55" y="127" text-anchor="middle" font-size="25">2</text><rect x="110" y="90" width="110" height="90" fill="#ffe4b2" stroke="#8a9baa"/><text x="165" y="127" text-anchor="middle" font-size="25">5</text><text x="165" y="151" text-anchor="middle" font-size="17">Current cell</text><rect x="220" y="90" width="110" height="90" fill="#eaf0f7" stroke="#8a9baa"/><text x="275" y="127" text-anchor="middle" font-size="25">8</text><rect x="0" y="180" width="110" height="90" fill="#eaf0f7" stroke="#8a9baa"/><text x="55" y="217" text-anchor="middle" font-size="25">1</text><text x="55" y="247" text-anchor="middle" font-size="17">Start</text><rect x="110" y="180" width="110" height="90" fill="#d8eeea" stroke="#8a9baa"/><text x="165" y="217" text-anchor="middle" font-size="25">4</text><rect x="220" y="180" width="110" height="90" fill="#eaf0f7" stroke="#8a9baa"/><text x="275" y="217" text-anchor="middle" font-size="25">7</text><path d="M90 110H142" stroke="#217b78" stroke-width="3" marker-end="url(#flow)" fill="none"/><path d="M185 211V167" stroke="#217b78" stroke-width="3" marker-end="url(#flow)" fill="none"/>
 <path d="M-22 270V-15" stroke="#217b78" stroke-width="2" marker-end="url(#flow)" fill="none"/><path d="M0 292H349" stroke="#217b78" stroke-width="2" marker-end="url(#flow)" fill="none"/>
 <text x="-32" y="-25" font-size="20" font-family="Georgia,serif">z</text><text x="357" y="299" font-size="20" font-family="Georgia,serif">r</text></g>
 <text x="0" y="530" font-size="18">Start at lower left. Sweep upward, column by column.</text><text x="0" y="563" font-size="18">Step 5 reads step 2 on the left and step 4 below.</text></g><g transform="translate(620 0)"><text x="0" y="125" font-size="22" font-weight="bold">Velocity toward the lower left</text>
 <text x="16" y="158" font-family="Georgia, serif" font-size="22">v<tspan baseline-shift="sub" font-size="14">r</tspan> &lt; 0, v<tspan baseline-shift="sub" font-size="14">z</tspan> &lt; 0</text><g transform="translate(25 195)"><rect x="0" y="0" width="110" height="90" fill="#eaf0f7" stroke="#8a9baa"/><text x="55" y="37" text-anchor="middle" font-size="25">7</text><rect x="110" y="0" width="110" height="90" fill="#d8eeea" stroke="#8a9baa"/><text x="165" y="37" text-anchor="middle" font-size="25">4</text><rect x="220" y="0" width="110" height="90" fill="#eaf0f7" stroke="#8a9baa"/><text x="275" y="37" text-anchor="middle" font-size="25">1</text><text x="275" y="67" text-anchor="middle" font-size="17">Start</text><rect x="0" y="90" width="110" height="90" fill="#eaf0f7" stroke="#8a9baa"/><text x="55" y="127" text-anchor="middle" font-size="25">8</text><rect x="110" y="90" width="110" height="90" fill="#ffe4b2" stroke="#8a9baa"/><text x="165" y="127" text-anchor="middle" font-size="25">5</text><text x="165" y="151" text-anchor="middle" font-size="17">Current cell</text><rect x="220" y="90" width="110" height="90" fill="#d8eeea" stroke="#8a9baa"/><text x="275" y="127" text-anchor="middle" font-size="25">2</text><rect x="0" y="180" width="110" height="90" fill="#eaf0f7" stroke="#8a9baa"/><text x="55" y="217" text-anchor="middle" font-size="25">9</text><rect x="110" y="180" width="110" height="90" fill="#eaf0f7" stroke="#8a9baa"/><text x="165" y="217" text-anchor="middle" font-size="25">6</text><rect x="220" y="180" width="110" height="90" fill="#eaf0f7" stroke="#8a9baa"/><text x="275" y="217" text-anchor="middle" font-size="25">3</text><path d="M242 110H195" stroke="#217b78" stroke-width="3" marker-end="url(#flow)" fill="none"/><path d="M165 56V101" stroke="#217b78" stroke-width="3" marker-end="url(#flow)" fill="none"/>
 <path d="M-22 270V-15" stroke="#217b78" stroke-width="2" marker-end="url(#flow)" fill="none"/><path d="M0 292H349" stroke="#217b78" stroke-width="2" marker-end="url(#flow)" fill="none"/>
 <text x="-32" y="-25" font-size="20" font-family="Georgia,serif">z</text><text x="357" y="299" font-size="20" font-family="Georgia,serif">r</text></g>
 <text x="0" y="530" font-size="18">Start at upper right. Sweep downward, column by column.</text><text x="0" y="563" font-size="18">Step 5 reads step 2 on the right and step 4 above.</text></g><rect x="32" y="598" width="22" height="22" fill="#d8eeea" stroke="#8a9baa"/><text x="66" y="615" font-size="18">Solved upstream cells</text><rect x="330" y="598" width="22" height="22" fill="#ffe4b2" stroke="#8a9baa"/><text x="364" y="615" font-size="18">Current cell</text>
<text x="32" y="646" font-size="18" fill="#516578">Both upstream results are available when the sweep reaches the current cell.</text></g></svg>
