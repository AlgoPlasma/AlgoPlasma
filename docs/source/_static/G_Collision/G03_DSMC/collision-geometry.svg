<svg xmlns="http://www.w3.org/2000/svg" class="geometry" viewBox="0 0 660 265" role="img" aria-labelledby="geom-title geom-desc"><title id="geom-title">碰撞截面的有效半径</title><desc id="geom-desc">固定球半径 d/2，入射球半径 d/2。入射球心与固定球心的横向距离小于 d 时碰撞。有效圆盘半径为两个球半径之和。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#17665e"/></marker></defs><circle cx="430" cy="135" r="90" fill="#e9f0e9" stroke="#17665e" stroke-dasharray="5 5"/><circle cx="430" cy="135" r="45" fill="#d6ded3" stroke="#657174"/><circle cx="135" cy="64" r="45" fill="#f7ebda" stroke="#a65d27"/><line x1="140" y1="64" x2="403" y2="64" stroke="#17665e" stroke-width="2" marker-end="url(#arrow)"/><line x1="345" y1="64" x2="345" y2="135" stroke="#a65d27" stroke-width="1.5"/><line x1="335" y1="135" x2="430" y2="135" stroke="#657174" stroke-dasharray="3 4"/><line x1="430" y1="135" x2="520" y2="135" stroke="#17665e" stroke-width="1.5"/><text x="313" y="107">b</text><text x="469" y="125">d</text><text x="78" y="151">入射球：半径 d/2</text><text x="380" y="247">球心可碰撞区域：半径 d</text><text x="256" y="44">相对速度 g</text></svg>
