      <div class="heading"><h1 id="title">两列波相遇，<span>会发生什么？</span></h1><p class="narration" id="narration">先看一列电子密度波，再让另一列加入。</p><p class="equation" id="equation" hidden></p></div>

  <noscript><div class="no-script"><p>在线性近似下，δn=δn₁+δn₂，而总密度 nₑ=n₀+δn。同向同频等幅波的合成幅值为 2A|cos(Δφ/2)|。近频波在固定位置产生拍，拍频等于频率之差的绝对值。等频等幅相向波形成驻波 δn=2A cos(kx)cos(ωt)。密度节点处 δn 始终为零，但电子仍可运动。</p><p>In the linear approximation, add perturbations: δn=δn₁+δn₂; total density is n₀+δn. Equal co-propagating waves give amplitude 2A|cos(Δφ/2)|. Nearby frequencies produce beats at |f₂−f₁|. Equal counterpropagating waves form δn=2A cos(kx)cos(ωt). At density nodes δn stays zero, but electrons can still move.</p><p>推导：取 k>0、ω>0，初相位均为零。向右波 δn₁=Acos(kx−ωt)=Acos(kx)cos(ωt)+Asin(kx)sin(ωt)；向左波 δn₂=Acos(kx+ωt)=Acos(kx)cos(ωt)−Asin(kx)sin(ωt)。相加时两个正弦乘积项抵消，因此 δn=δn₁+δn₂=2Acos(kx)cos(ωt)。A 是每列行波的幅值 [m⁻³]；k [rad/m]，ω [rad/s]，x [m]，t [s]。合成局部幅值是 2A|cos(kx)|；cos(kx)=0 的固定位置在所有时刻都有 δn=0。</p><p>Derivation: take k>0, ω>0 and zero initial phases. The rightward wave is δn₁=Acos(kx−ωt)=Acos(kx)cos(ωt)+Asin(kx)sin(ωt). The leftward wave is δn₂=Acos(kx+ωt)=Acos(kx)cos(ωt)−Asin(kx)sin(ωt). The sine products cancel in the sum, leaving δn=δn₁+δn₂=2Acos(kx)cos(ωt). A is each traveling wave amplitude [m⁻³]; k [rad/m], ω [rad/s], x [m], t [s]. The local resultant amplitude is 2A|cos(kx)|. At fixed positions where cos(kx)=0, δn=0 at every time.</p></div></noscript>
