  <noscript><div class="no-script"><p>07 · 第一条色散关系怎样推出来？</p><p>在均匀、无磁场、离子固定的模型中，先忽略电子压强。此时线性连续性方程为 ∂ₜn₁+n₀∂ₓv₁=0；动量方程为 mₑ∂ₜv₁=−eE₁；泊松方程为 ∂ₓE₁=−en₁/ε₀。使用共同的 exp[i(kx−ωt)] 后，∂ₜ→−iω，∂ₓ→ik。消去速度和电场振幅得到 (ω²−n₀e²/(mₑε₀))N=0。非零密度波要求 ω²=ωpe²=n₀e²/(mₑε₀)。加入压强与密度的关系 p₁=mₑu²n₁ 后得到 ω²=ωpe²+u²k²。n₁、N、n₀ [m⁻³]；v₁、u [m/s]；E₁ [V/m]；p₁ [Pa]；k [rad/m]；ω [rad/s]。</p><p>For a uniform electron background with no magnetic field and fixed ions, first neglect electron pressure. Then linear continuity, momentum and Poisson give ∂ₜn₁+n₀∂ₓv₁=0, mₑ∂ₜv₁=−eE₁ and ∂ₓE₁=−en₁/ε₀. Use exp[i(kx−ωt)], so ∂ₜ→−iω and ∂ₓ→ik. Eliminating velocity and field amplitudes gives (ω²−n₀e²/(mₑε₀))N=0. A nonzero mode requires ω²=ωpe²=n₀e²/(mₑε₀). With p₁=mₑu²n₁, pressure adds u²k². Density is in m⁻³, velocities in m/s, field in V/m, pressure in Pa, k in rad/m and ω in rad/s.</p></div></noscript>
