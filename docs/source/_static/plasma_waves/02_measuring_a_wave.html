  <noscript><div class="no-script"><p>在固定位置测量电子密度，相邻两个密度峰经过的时间间隔是周期 T，频率 f=1/T。冻结同一时刻，相邻两个密度峰的空间间隔是波长 λ。同一波峰在 T 内前进 λ，因此相速度 v=λ/T=λf；它不是单个电子的速度。</p><p>At a fixed position, successive density maxima are separated by a period T; f=1/T. At a fixed time, adjacent maxima are a wavelength λ apart. A crest advances λ in T, giving phase speed λ/T=λf, not the speed of an electron.</p><p>同一时刻，Δφ=kΔx，k=2π/λ。固定位置，Δφ=−ωΔt，ω=2π/T。半波长处反相，一波长处同相。δn=A cos(kx−ωt+φ₀) 描述相对于背景 n₀ 的密度扰动；同相位点向右以 ω/k 移动。</p><p>At the same instant, Δφ=kΔx with k=2π/λ. At a fixed position, Δφ=−ωΔt with ω=2π/T. A half-wavelength separation gives opposite phase; one wavelength gives the same phase. The density perturbation δn=A cos(kx−ωt+φ₀) moves right at phase speed ω/k.</p></div></noscript>
