    <main>
      <div class="heading"><h1 id="title">一列波，<span>怎样测量？</span></h1><p class="narration" id="narration">看同一列电子疏密波，从时间和空间分别测量。</p><p class="equation" id="equation" hidden></p></div>
      <figure class="scene" id="scene"><canvas id="plasma" role="img" aria-label="向右传播的电子密度波">固定位置测周期，固定时刻测波长。同一密度峰在一个周期内前进一个波长。</canvas><p id="canvas-fallback" hidden>固定位置测周期 T，固定时刻测波长 λ，相速度 v = λ/T。 / Measure T at a fixed point and λ at a fixed time; phase speed is λ/T.</p><figcaption id="model-note"></figcaption></figure>

  <noscript><div class="no-script"><p>在固定位置测量电子密度，相邻两个密度峰经过的时间间隔是周期 T，频率 f=1/T。冻结同一时刻，相邻两个密度峰的空间间隔是波长 λ。同一波峰在 T 内前进 λ，因此相速度 v=λ/T=λf；它不是单个电子的速度。</p><p>At a fixed position, successive density maxima are separated by a period T; f=1/T. At a fixed time, adjacent maxima are a wavelength λ apart. A crest advances λ in T, giving phase speed λ/T=λf, not the speed of an electron.</p></div></noscript>
