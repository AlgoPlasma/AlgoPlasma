  <noscript><div class="no-script"><p>相近波数的分量可以叠成波包。相速度 vph=ωc/kc [m/s] 描述中心分量的等相位面；窄带、弱失真条件下，包络速度近似为群速度 vg=(dω/dk)c [m/s]。本例 ω²=ω₀²+u²k²，ω₀=10⁸ rad/s，u=10⁶ m/s，kc=60 rad/m，得到 vph≈1.944×10⁶ m/s，vg≈0.514×10⁶ m/s。原点连线给相速度，切线给群速度。无色散对照 ω=Vk 中，两者均为 V。它们都不是单个电子的运动速度。</p><p>Nearby wavenumbers can form a packet. Phase speed vph=ωc/kc [m/s] follows a constant phase of the central component. For a narrow band with little distortion, the envelope speed is approximately vg=(dω/dk)c [m/s]. Our fluid example uses ω²=ω₀²+u²k², ω₀=10⁸ rad/s, u=10⁶ m/s and kc=60 rad/m: vph≈1.944×10⁶m/s and vg≈0.514×10⁶m/s. Read phase speed from the origin-to-point slope and group speed from the tangent. For the nondispersive comparison ω=Vk, both equal V. Neither is an individual electron velocity.</p></div></noscript>
