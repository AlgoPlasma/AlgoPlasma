        <p id="canvas-fallback" hidden>δn = Re{n̂ exp[i(kx−ωt)]}，n̂ = A exp(iφ₀)。复振幅的单位为 m⁻³。 / Recover the real density perturbation as Re{n̂ exp[i(kx−ωt)]}, with n̂ = A exp(iφ₀) in m⁻³.</p>

  <noscript><div class="no-script"><p>i²=−1；Ae^{iθ}=Acosθ+iAsinθ。密度扰动 δn=Re{ñ}，其中 ñ=n̂e^{i(kx−ωt)}，n̂=Ae^{iφ₀}。A、n̂、ñ 和 δn 均用 m⁻³；φ₀ 用 rad，k 用 rad/m，ω 用 rad/s。复平面两轴是密度扰动的实部和虚部，不是空间方向。同 k、同 ω 的波可直接叠加常复振幅。对这一平面波，∂ₜñ=−iωñ、∂ₓñ=ikñ，单位分别为 m⁻³/s 和 m⁻⁴。图中用导数除以 ω 或 k 后的量比较相位；实际总密度为 n₀+δn。</p><p>With i²=−1, Ae^{iθ}=Acosθ+iAsinθ. Recover density perturbation as δn=Re{ñ}, where ñ=n̂e^{i(kx−ωt)} and n̂=Ae^{iφ₀}. A, n̂, ñ and δn use m⁻³; φ₀ uses rad, k rad/m and ω rad/s. The complex axes describe real and imaginary density components, not spatial directions. Add constant complex amplitudes for waves with the same k and ω. For this plane wave, ∂ₜñ=−iωñ and ∂ₓñ=ikñ, in m⁻³/s and m⁻⁴. Plotted derivatives are divided by ω or k to compare phase. Total density is n₀+δn.</p><p>时间偏导：固定 x，∂ₜ[i(kx−ωt)]=−iω。由链式法则，∂ₜñ=n̂ e<sup>i(kx−ωt)</sup>(−iω)=−iωñ。空间偏导：固定 t，∂ₓ[i(kx−ωt)]=ik，因此 ∂ₓñ=n̂ e<sup>i(kx−ωt)</sup>(ik)=ikñ。令 θ=kx−ωt+φ₀，取实部得到 ∂ₜδn=Aω sinθ [m⁻³/s]、∂ₓδn=−Ak sinθ [m⁻⁴]。这里复振幅 n̂、k 和 ω 都是常量；若复振幅变化，需要加入乘积法则中的振幅导数项。</p><p>Time partial derivative: hold x fixed, so ∂ₜ[i(kx−ωt)]=−iω. By the chain rule, ∂ₜñ=n̂ e<sup>i(kx−ωt)</sup>(−iω)=−iωñ. Space partial derivative: hold t fixed, so ∂ₓ[i(kx−ωt)]=ik and ∂ₓñ=n̂ e<sup>i(kx−ωt)</sup>(ik)=ikñ. With θ=kx−ωt+φ₀, taking real parts gives ∂ₜδn=Aω sinθ [m⁻³/s] and ∂ₓδn=−Ak sinθ [m⁻⁴]. These results assume constant n̂, k and ω; a varying amplitude requires additional product-rule terms.</p></div></noscript>
