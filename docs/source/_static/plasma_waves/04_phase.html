  <noscript><div class="no-script"><p>同一时刻，Δφ=kΔx，k=2π/λ。固定位置，Δφ=−ωΔt，ω=2π/T。半波长处反相，一波长处同相。δn=A cos(kx−ωt+φ₀) 描述相对于背景 n₀ 的密度扰动；同相位点向右以 ω/k 移动。</p><p>At the same instant, Δφ=kΔx with k=2π/λ. At a fixed position, Δφ=−ωΔt with ω=2π/T. A half-wavelength separation gives opposite phase; one wavelength gives the same phase. The density perturbation δn=A cos(kx−ωt+φ₀) moves right at phase speed ω/k.</p></div></noscript>
