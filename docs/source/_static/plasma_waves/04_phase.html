      <div class="heading"><h1 id="title">不同位置，<span>为什么不同时起伏？</span></h1><p class="narration" id="narration">各处都在周期性起伏，却不一定同时达到密度最高。</p><p class="equation" id="equation" hidden></p></div>
      <figure class="scene" id="scene"><canvas id="plasma" role="img" aria-label="向右传播的电子密度波">两处密度起伏由相位差联系。δn=A cos(kx−ωt+φ₀)。</canvas><p id="canvas-fallback" hidden>相位差 Δφ=kΔx；k=2π/λ，ω=2π/T。 / Phase difference Δφ=kΔx; k=2π/λ and ω=2π/T.</p><figcaption id="model-note"></figcaption></figure>

  <noscript><div class="no-script"><p>同一时刻，Δφ=kΔx，k=2π/λ。固定位置，Δφ=−ωΔt，ω=2π/T。半波长处反相，一波长处同相。δn=A cos(kx−ωt+φ₀) 描述相对于背景 n₀ 的密度扰动；同相位点向右以 ω/k 移动。</p><p>At the same instant, Δφ=kΔx with k=2π/λ. At a fixed position, Δφ=−ωΔt with ω=2π/T. A half-wavelength separation gives opposite phase; one wavelength gives the same phase. The density perturbation δn=A cos(kx−ωt+φ₀) moves right at phase speed ω/k.</p></div></noscript>
