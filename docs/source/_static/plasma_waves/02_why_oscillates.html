        <div class="species" aria-hidden="true"><span><i class="electron-key"></i><span id="electron-name">电子层</span></span><span class="ions"><b>+</b><span id="ion-name">固定离子层</span></span></div>

      </figure>

        <p id="takeaway-text"><span class="mint">电场把电子拉回，</span><br class="mobile-break"><span class="gold">惯性让它越过原位。</span></p>

  <noscript><div class="no-script"><p>电子层向右偏移，左侧留下正电、右侧出现负电。电场向右，负电子受力向左。回到平衡位置时，电子仍有速度；越过原位后，电场和恢复力反向。这就是理想模型中的往复振荡。</p><p>Displacing the electron layer to the right exposes positive charge on the left and negative charge on the right. The field points right and the electron force points left. Electrons still have velocity at equilibrium; after crossing it, the restoring force reverses.</p></div></noscript>
