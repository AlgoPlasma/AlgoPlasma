  <noscript><div class="no-script"><p>色散图横轴是波数 k [rad/m]，纵轴是角频率 ω [rad/s]。曲线表示某个模型允许的自由波分量；它不是运动轨迹。本例给定 ω²=ω₀²+u²k²，ω₀=10⁸ rad/s、u=10⁶ m/s。它是均匀、无磁场、固定离子的温电子流体模型，忽略碰撞与动理学阻尼。u 是压强项的速度参数，不是电子速度。</p><p>选 k=40 rad/m，得 ω≈1.077×10⁸ rad/s。由 λ=2π/k 得 λ≈0.157 m；由 T=2π/ω 得 T≈5.83×10⁻⁸ s。原点到这个点的连线斜率为相速度 ω/k≈2.693×10⁶ m/s，不是曲线在该点的切线斜率，也不是电子速度。</p><p>A dispersion plot uses horizontal k [rad/m] and vertical ω [rad/s]. Its curve represents free-wave components permitted by a model, not a trajectory. This warm-electron fluid example uses ω²=ω₀²+u²k² with ω₀=10⁸ rad/s and u=10⁶ m/s: uniform, unmagnetized, fixed ions, no collisions or kinetic damping. The pressure parameter u is not particle velocity. At k=40 rad/m, ω≈1.077×10⁸ rad/s, λ=2π/k≈0.157m and T=2π/ω≈5.83×10⁻⁸s. The origin-to-point slope gives phase speed ω/k≈2.693×10⁶m/s, not the tangent slope or electron velocity.</p><p>在线性近似下，取 k=20、50、80 rad/m，每个 ωⱼ 由上述曲线确定。选中分量 Aⱼ=0.06n₀、φⱼ=0 rad，δn=∑ⱼAⱼcos(kⱼx−ωⱼt+φⱼ)。δn、Aⱼ、n₀ [m⁻³]；x [m]；t [s]。色散关系规定允许的配对，实际激发还需指定幅值和初相位。电子点阵对应总密度，而非三组电子的位置相加。</p><p>In the linear approximation, choose k=20, 50, 80 rad/m with each ωⱼ set by the branch. Selected amplitudes are Aⱼ=0.06n₀ with initial phases φⱼ=0 rad. Sum δn=∑ⱼAⱼcos(kⱼx−ωⱼt+φⱼ), with δn, Aⱼ, n₀ [m⁻³], x [m], t [s]. Dispersion specifies allowed pairs; excitation also requires amplitudes and initial phases. One dot population represents the total density, rather than adding the positions of three populations.</p></div></noscript>
