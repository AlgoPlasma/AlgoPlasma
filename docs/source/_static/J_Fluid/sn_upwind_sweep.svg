<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">两种速度方向下的迎风扫描</title>
<desc id="desc">左图速度指向右上，先算左下单元，中心单元读取左侧和下侧。右图速度指向左下，先算右上单元，中心单元读取右侧和上侧。数字一至九是当前代码的单元求解顺序。</desc>
<defs><marker id="flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#217b78"/></marker></defs>
<rect width="1120" height="660" rx="12" fill="#f7f9fc"/>
<g font-family="Arial, Microsoft YaHei, sans-serif" fill="#233446">
<text x="32" y="40" font-size="25" font-weight="bold">同一空间网格，速度方向不同，求解顺序也不同</text>
<text x="32" y="75" font-size="19">每幅图固定一个离散速度。数字表示求解顺序，箭头表示中心单元从哪里取得入流。</text><g transform="translate(65 0)"><text x="0" y="125" font-size="22" font-weight="bold">例一：粒子向右上方运动</text>
 <text x="0" y="158" font-family="Georgia, serif" font-size="22">v<tspan baseline-shift="sub" font-size="14">r</tspan> &gt; 0，v<tspan baseline-shift="sub" font-size="14">z</tspan> &gt; 0</text><g transform="translate(25 195)"><rect x="0" y="0" width="110" height="90" fill="#eaf0f7" stroke="#8a9baa"/><text x="55" y="37" text-anchor="middle" font-size="25">3</text><rect x="110" y="0" width="110" height="90" fill="#eaf0f7" stroke="#8a9baa"/><text x="165" y="37" text-anchor="middle" font-size="25">6</text><rect x="220" y="0" width="110" height="90" fill="#eaf0f7" stroke="#8a9baa"/><text x="275" y="37" text-anchor="middle" font-size="25">9</text><rect x="0" y="90" width="110" height="90" fill="#d8eeea" stroke="#8a9baa"/><text x="55" y="127" text-anchor="middle" font-size="25">2</text><rect x="110" y="90" width="110" height="90" fill="#ffe4b2" stroke="#8a9baa"/><text x="165" y="127" text-anchor="middle" font-size="25">5</text><text x="165" y="151" text-anchor="middle" font-size="17">当前单元</text><rect x="220" y="90" width="110" height="90" fill="#eaf0f7" stroke="#8a9baa"/><text x="275" y="127" text-anchor="middle" font-size="25">8</text><rect x="0" y="180" width="110" height="90" fill="#eaf0f7" stroke="#8a9baa"/><text x="55" y="217" text-anchor="middle" font-size="25">1</text><text x="55" y="247" text-anchor="middle" font-size="17">从这里开始</text><rect x="110" y="180" width="110" height="90" fill="#d8eeea" stroke="#8a9baa"/><text x="165" y="217" text-anchor="middle" font-size="25">4</text><rect x="220" y="180" width="110" height="90" fill="#eaf0f7" stroke="#8a9baa"/><text x="275" y="217" text-anchor="middle" font-size="25">7</text><path d="M90 110H142" stroke="#217b78" stroke-width="3" marker-end="url(#flow)" fill="none"/><path d="M185 211V167" stroke="#217b78" stroke-width="3" marker-end="url(#flow)" fill="none"/>
 <path d="M-22 270V-15" stroke="#217b78" stroke-width="2" marker-end="url(#flow)" fill="none"/><path d="M0 292H349" stroke="#217b78" stroke-width="2" marker-end="url(#flow)" fill="none"/>
 <text x="-32" y="-25" font-size="20" font-family="Georgia,serif">z</text><text x="357" y="299" font-size="20" font-family="Georgia,serif">r</text></g>
 <text x="0" y="530" font-size="18">从左下开始：每列向上求解，再向右移一列。</text><text x="0" y="563" font-size="18">第 5 步读取左侧第 2 步、下侧第 4 步的结果。</text></g><g transform="translate(620 0)"><text x="0" y="125" font-size="22" font-weight="bold">例二：粒子向左下方运动</text>
 <text x="0" y="158" font-family="Georgia, serif" font-size="22">v<tspan baseline-shift="sub" font-size="14">r</tspan> &lt; 0，v<tspan baseline-shift="sub" font-size="14">z</tspan> &lt; 0</text><g transform="translate(25 195)"><rect x="0" y="0" width="110" height="90" fill="#eaf0f7" stroke="#8a9baa"/><text x="55" y="37" text-anchor="middle" font-size="25">7</text><rect x="110" y="0" width="110" height="90" fill="#d8eeea" stroke="#8a9baa"/><text x="165" y="37" text-anchor="middle" font-size="25">4</text><rect x="220" y="0" width="110" height="90" fill="#eaf0f7" stroke="#8a9baa"/><text x="275" y="37" text-anchor="middle" font-size="25">1</text><text x="275" y="67" text-anchor="middle" font-size="17">从这里开始</text><rect x="0" y="90" width="110" height="90" fill="#eaf0f7" stroke="#8a9baa"/><text x="55" y="127" text-anchor="middle" font-size="25">8</text><rect x="110" y="90" width="110" height="90" fill="#ffe4b2" stroke="#8a9baa"/><text x="165" y="127" text-anchor="middle" font-size="25">5</text><text x="165" y="151" text-anchor="middle" font-size="17">当前单元</text><rect x="220" y="90" width="110" height="90" fill="#d8eeea" stroke="#8a9baa"/><text x="275" y="127" text-anchor="middle" font-size="25">2</text><rect x="0" y="180" width="110" height="90" fill="#eaf0f7" stroke="#8a9baa"/><text x="55" y="217" text-anchor="middle" font-size="25">9</text><rect x="110" y="180" width="110" height="90" fill="#eaf0f7" stroke="#8a9baa"/><text x="165" y="217" text-anchor="middle" font-size="25">6</text><rect x="220" y="180" width="110" height="90" fill="#eaf0f7" stroke="#8a9baa"/><text x="275" y="217" text-anchor="middle" font-size="25">3</text><path d="M242 110H195" stroke="#217b78" stroke-width="3" marker-end="url(#flow)" fill="none"/><path d="M165 56V101" stroke="#217b78" stroke-width="3" marker-end="url(#flow)" fill="none"/>
 <path d="M-22 270V-15" stroke="#217b78" stroke-width="2" marker-end="url(#flow)" fill="none"/><path d="M0 292H349" stroke="#217b78" stroke-width="2" marker-end="url(#flow)" fill="none"/>
 <text x="-32" y="-25" font-size="20" font-family="Georgia,serif">z</text><text x="357" y="299" font-size="20" font-family="Georgia,serif">r</text></g>
 <text x="0" y="530" font-size="18">从右上开始：每列向下求解，再向左移一列。</text><text x="0" y="563" font-size="18">第 5 步读取右侧第 2 步、上侧第 4 步的结果。</text></g><rect x="32" y="598" width="22" height="22" fill="#d8eeea" stroke="#8a9baa"/><text x="66" y="615" font-size="18">本轮已经求出的上游单元</text><rect x="330" y="598" width="22" height="22" fill="#ffe4b2" stroke="#8a9baa"/><text x="364" y="615" font-size="18">当前待求单元</text>
<text x="32" y="646" font-size="18" fill="#516578">迎风顺序保证：求当前单元时，它需要的两个上游单元都已有本轮结果。</text></g></svg>
