# AlgoPlasma contributors
# ======================
#
# This file is the single source of truth for the contributor list.  The
# README section and the Read the Docs page are both generated from it:
#
#     python3 tools/generate_contributors.py
#
# Fields
# ------
#   name           Latin/pinyin display name, given name first (required)
#   name_zh        Chinese name, used on the Chinese README pages (optional)
#   role           lead | maintainer | contributor   (default: contributor)
#   contributions  list of contribution types, or `all` for every type
#   work_modules   module IDs for documented work (lead/maintainer only)
#   biography      zh/en personal introduction, shown instead of documented work
#   research_interests  zh/en research interests, shown above documented work
#   github         GitHub username (optional)
#   gitee          Gitee username (optional)
#   orcid          ORCID iD, e.g. 0000-0000-0000-0000 (optional)
#   avatar         explicit avatar URL or repo-relative image path (optional)
#
# Leads and maintainers use `default_avatar` until their own photo is ready.
# `initials` generates a colored avatar with the surname initial followed by
# the given-name initial: Xi Chen -> CX, Yingjie Chen -> CY.
# A shared image URL or repo-relative path is also accepted as `default_avatar`.
# Ordinary contributors use their GitHub avatar, or Gitee avatar if GitHub is
# absent; members without either account use `default_avatar`.
# An explicit `avatar` overrides these defaults for any role.
# To replace one person's image, put a square photo in
# docs/source/_static/contributors/ and add an `avatar` field to that member:
#     avatar: docs/source/_static/contributors/example-user.jpg
# Then rerun the generator. Paths are relative to the repository root.
# 中文：把个人方形照片放到上述目录，在对应成员下添加 avatar 路径，再运行生成器。
#
# Contribution types
# ------------------
#   code       💻 Code            docs       📖 Documentation
#   tests      🧪 Tests           examples   🎓 Examples
#   benchmark  📊 Benchmark       bug        🐛 Bug fixes
#
# Spelled-out aliases are accepted too (software, validation, performance,
# writing, tutorial, fix, ...).  Unknown keys stop the generator with an error
# so typos are caught early.
#
# `work_catalog` supplies the public descriptions for `work_modules`.  Module
# IDs are internal references: generated pages show the descriptions, not IDs.
# Chinese pages sort maintainers by surname pinyin, English pages by given name;
# the project lead always comes first.
#
# Adding a contributor
# --------------------
#   - name: Example User
#     github: example
#     role: contributor
#     contributions:
#       - code
#       - bug

default_avatar: initials

